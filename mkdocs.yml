site_name: "Mathesis — Mathematical Knowledge Base"
site_description: >
  Документация проекта Mathesis: извлечение, формализация и структуризация
  математических сущностей из учебников.

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3

nav:
  - Главная: index.md
  - Архитектура:
      - Обзор системы: architecture/overview.md
      - ER-модель и схема БД: architecture/design.md
  - Руководства:
      - Развёртывание: howto/deployment.md
      - Генерация первого документа: howto/generate_doc.md
      - Добавление нового шаблона: howto/add_template.md
      - Отладка LaTeX-ошибок: howto/debug_latex.md
  - Справочник API:
      - mathesis.core: reference/core.md
      - mathesis.models: reference/models.md
      - mathesis.db: reference/db.md
      - mathesis.queries: reference/queries.md
      - mathesis.validator: reference/validator.md
      - mathesis.exceptions: reference/exceptions.md
      - web.app: reference/web_app.md
  - Руководство разработчика:
      - Структура проекта: devguide/structure.md
      - Правила оформления кода: devguide/conventions.md
